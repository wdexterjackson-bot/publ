<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Lellon — Legal</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1c1c1e; --muted:#6b6b70; --accent:#0a6b5f; --rule:#e3e3e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131315; --fg:#ececee; --muted:#9a9aa0; --accent:#5fd1bd; --rule:#2c2c30; } }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:38rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:2rem; margin:0 0 .35rem; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:0 0 2.5rem; }
  a { color:var(--accent); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:1rem 0; border-top:1px solid var(--rule); }
  li span { display:block; color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask Lellon</h1>
  <p class="sub">Legal documents for the Ask Lellon iOS app.</p>
  <ul>
    <li>
      <a href="privacy.html">Privacy Policy</a>
      <span>What the app collects, where it is stored, and how to delete it.</span>
    </li>
  </ul>
</div>
</body>
</html>
